<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="初期費用計算">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <title>賃貸初期費用計算</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2933;
      --muted: #687381;
      --line: #d4dbe3;
      --paper: #ffffff;
      --base: #eef2f5;
      --field: #ffffff;
      --accent: #0f766e;
      --accent-2: #b45309;
      --good: #166534;
      --danger: #b91c1c;
      --shadow: 0 10px 24px rgba(38, 50, 56, .10);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--base);
      min-height: 100svh;
    }

    button, input, select, textarea {
      font: inherit;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      padding: 4px 2px 14px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .total-chip {
      min-width: 128px;
      padding: 10px 12px;
      border: 1px solid rgba(15, 118, 110, .25);
      border-radius: 8px;
      background: rgba(255, 255, 255, .72);
      text-align: right;
      box-shadow: 0 6px 18px rgba(15, 118, 110, .08);
    }

    .total-chip span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }

    .total-chip strong {
      display: block;
      margin-top: 2px;
      color: var(--accent);
      font-size: 20px;
      white-space: nowrap;
    }

    main {
      display: grid;
      gap: 12px;
    }

    section {
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(217, 224, 232, .8);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .62);
    }

    h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0;
    }

    .section-total {
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .fields {
      display: grid;
      gap: 10px;
      padding: 12px;
    }

    .grid-2 {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }

    .grid-3 {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr 1fr;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    input, select, textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--field);
      color: var(--ink);
      padding: 10px 11px;
      outline: none;
      appearance: none;
    }

    textarea {
      min-height: 74px;
      resize: vertical;
      line-height: 1.5;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, .14);
    }

    input[aria-invalid="true"] {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(185, 28, 28, .12);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

      .line-item {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .72);
    }

    .line-item.is-muted {
      opacity: .58;
      background: #f7f9fb;
    }

    .optional-cost-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 2px 12px 0;
      padding: 14px 2px 8px;
      border-top: 1px solid var(--line);
    }

    .optional-cost-head h3 {
      margin: 0;
      font-size: 13px;
      letter-spacing: 0;
    }

    .extra-title {
      gap: 10px;
    }

    .extra-title > span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .extra-title-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .remove-row {
      min-width: 44px;
      min-height: 36px;
      border: 1px solid #d7c7c7;
      border-radius: 8px;
      padding: 6px 9px;
      color: #8a3030;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .monthly-item {
      padding: 0;
    }

    .monthly-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 18px;
      gap: 10px;
      align-items: center;
      min-height: 58px;
      padding: 10px;
      cursor: pointer;
      list-style: none;
    }

    .monthly-summary::-webkit-details-marker {
      display: none;
    }

    .monthly-summary::after {
      content: ">";
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
      transform-origin: center;
      transition: transform .16s ease;
    }

    .monthly-item[open] .monthly-summary::after {
      transform: rotate(90deg);
    }

    .monthly-summary-copy {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .monthly-summary-copy > strong {
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .monthly-summary output {
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .monthly-flags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .state-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 6px;
      background: #f7f9fb;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.35;
    }

    .state-pill.is-on {
      border-color: rgba(15, 118, 110, .32);
      background: #ecfdf5;
      color: #0f4f4a;
    }

    .monthly-edit {
      display: grid;
      gap: 10px;
      padding: 0 10px 10px;
      border-top: 1px solid #e5eaf0;
      padding-top: 10px;
    }

    .line-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
    }

    .line-title output {
      color: var(--accent);
      font-weight: 800;
      white-space: nowrap;
    }

    .reference-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .advance-breakdown {
      display: grid;
      gap: 4px;
      padding: 9px 10px;
      border: 1px solid #e5eaf0;
      border-radius: 8px;
      background: #f7f9fb;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .advance-breakdown:empty {
      display: none;
    }

    .advance-breakdown strong {
      color: var(--ink);
      font-weight: 800;
    }

    .date-required-notice {
      display: block;
      width: 100%;
      min-height: 54px;
      border: 1px solid rgba(180, 83, 9, .42);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff7ed;
      color: #7c2d12;
      text-align: left;
      box-shadow: none;
    }

    .date-required-notice strong,
    .date-required-notice span {
      display: block;
    }

    .date-required-notice strong {
      font-size: 13px;
    }

    .date-required-notice span {
      margin-top: 3px;
      color: #9a4b0a;
      font-size: 11px;
    }

    .date-required-notice:focus-visible {
      outline: none;
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(180, 83, 9, .14);
    }

    .advance-date-fields {
      transition: opacity .16s ease;
    }

    .advance-date-fields.is-waiting {
      opacity: .46;
    }

    .mode-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .mode-row.compact {
      grid-template-columns: 1fr 1fr;
    }

    [hidden] {
      display: none !important;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      color: var(--ink);
      font-size: 13px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      transition: background .16s ease, border-color .16s ease, color .16s ease;
    }

    .toggle.is-on,
    .toggle:has(input:checked) {
      color: #0f4f4a;
      border-color: rgba(15, 118, 110, .42);
      background: #ecfdf5;
      font-weight: 800;
    }

    .toggle input {
      width: 22px;
      height: 22px;
      min-height: 22px;
      appearance: auto;
      -webkit-appearance: checkbox;
      accent-color: var(--accent);
    }

    .toggle-copy {
      min-width: 0;
    }

    .toggle-status {
      margin-left: auto;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .toggle.is-on .toggle-status,
    .toggle:has(input:checked) .toggle-status {
      color: #0f4f4a;
    }

    .actions {
      position: sticky;
      bottom: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 9px;
      padding: 12px 0 0;
      background: linear-gradient(transparent, var(--base) 28%);
    }

    .actions button, .ghost-button {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      padding: 11px 12px;
      color: #fff;
      background: var(--accent);
      font-weight: 800;
      box-shadow: 0 9px 22px rgba(15, 118, 110, .22);
    }

    .actions button:disabled {
      opacity: .64;
    }

    .actions button.secondary, .ghost-button {
      background: #3c4654;
      box-shadow: 0 9px 22px rgba(60, 70, 84, .18);
    }

    .small-action {
      display: flex;
      justify-content: flex-end;
      padding: 0 12px 12px;
    }

    .ghost-button {
      min-height: 38px;
      padding: 8px 10px;
      font-size: 12px;
      box-shadow: none;
    }

    .ghost-button.danger {
      border: 1px solid #d7c7c7;
      color: #8a3030;
      background: #fff;
    }

    #shareCard {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 760px;
      background: var(--paper);
      color: var(--ink);
      padding: 34px;
    }

    .toast {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: calc(74px + env(safe-area-inset-bottom));
      transform: translateY(18px);
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      border-radius: 8px;
      padding: 12px 14px;
      background: rgba(31, 41, 51, .94);
      color: #fff;
      font-size: 13px;
      text-align: center;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .preview-sheet {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      padding: calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
      background: rgba(31, 41, 51, .68);
      overflow: auto;
    }

    .preview-sheet.show {
      display: block;
    }

    .preview-panel {
      width: min(100%, 620px);
      margin: 0 auto;
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      box-shadow: 0 18px 46px rgba(0, 0, 0, .24);
    }

    .preview-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .preview-actions a,
    .preview-actions button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      padding: 11px 10px;
    }

    .preview-actions button {
      background: #3c4654;
    }

    .preview-panel img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
    }

    @media (max-width: 560px) {
      header { align-items: stretch; }
      h1 { font-size: 23px; }
      .total-chip { min-width: 116px; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .mode-row.compact { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .actions {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }
      .actions button {
        min-height: 46px;
        padding: 9px 4px;
        font-size: 12px;
      }
    }

    @media print {
      @page { size: A4 portrait; margin: 0; }
      html, body {
        width: 210mm;
        height: 297mm;
      }
      body { background: #fff; }
      .app > header, .app > main, .actions, .toast, .preview-sheet { display: none !important; }
      #shareCard {
        position: static;
        width: 210mm;
        height: 297mm;
        padding: 0;
        overflow: hidden;
      }
      #shareCard .print-sheet {
        display: flex;
        width: 210mm;
        height: 297mm;
        align-items: center;
        justify-content: center;
      }
      #shareCard .print-sheet img {
        display: block;
        width: 210mm;
        height: 297mm;
        object-fit: contain;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>賃貸初期費用計算</h1>
      </div>
      <div class="total-chip">
        <span>概算合計</span>
        <strong id="grandTotalTop">0円</strong>
      </div>
    </header>

    <main>
      <section>
        <div class="section-head">
          <h2>物件・賃料</h2>
          <strong class="section-total" id="rentBaseTotal">0円/月</strong>
        </div>
        <div class="fields">
          <div class="grid-2">
            <label>物件名
              <input id="propertyName" required placeholder="例: サンプルマンション">
            </label>
            <label>号室
              <input id="roomNumber" placeholder="例: 203">
            </label>
          </div>
          <div class="grid-2">
            <label>お客様名
              <input id="customerName" placeholder="例: 山田様">
            </label>
            <label>契約開始日
              <input id="contractStartDate" type="date" required>
            </label>
          </div>
          <div class="grid-2">
            <label>賃料
              <input id="rent" type="text" inputmode="decimal" required data-money data-assume-man="true" placeholder="例: 23.5万">
            </label>
            <label>管理費・共益費
              <input id="management" type="text" inputmode="decimal" data-money data-assume-man="true" placeholder="例: 1.2万">
            </label>
          </div>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>月次費用</h2>
          <strong class="section-total" id="monthlyFeesTotal">0円/月</strong>
        </div>
        <div class="fields" id="monthlyItems"></div>
        <div class="small-action">
          <button class="ghost-button" id="addMonthly" type="button">追加行</button>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>契約時費用</h2>
          <strong class="section-total" id="contractTotal">0円</strong>
        </div>
        <div class="fields" id="contractItems"></div>
        <div class="optional-cost-head">
          <h3>任意の初期費用</h3>
          <strong class="section-total" id="extraTotal">0円</strong>
        </div>
        <div class="fields" id="extraItems"></div>
        <div class="small-action">
          <button class="ghost-button" id="addExtra" type="button">＋ 項目を追加</button>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>前賃料</h2>
          <strong class="section-total" id="advanceTotal">0円</strong>
        </div>
        <div class="fields">
          <div class="line-item">
            <div class="line-title">当月日割前賃料 <output id="proratedOutput">0円</output></div>
            <button class="date-required-notice" id="advanceDatePrompt" type="button">
              <strong>契約開始日を入力してください</strong>
              <span>タップして入力欄へ移動</span>
            </button>
            <div class="advance-breakdown" id="currentAdvanceBreakdown"></div>
            <div class="grid-3 advance-date-fields" id="currentAdvanceFields">
              <label>対象日数
                <input id="currentChargeDays" readonly value="0日">
              </label>
              <label>無料日数
                <input id="currentFreeDays" readonly value="0日">
              </label>
              <label>月の日数
                <input id="daysInMonth" readonly value="0日">
              </label>
            </div>
          </div>
          <div class="line-item">
            <div class="line-title">翌月分前賃料 <output id="nextMonthOutput">0円</output></div>
            <div class="advance-breakdown" id="nextMonthBreakdown"></div>
            <div class="reference-note" id="nextMonthNote"></div>
            <label class="toggle">
              <input id="includeNextMonth" type="checkbox" checked>
              請求に含める
            </label>
          </div>
          <div class="line-item">
            <div class="line-title">翌々月分前賃料 <output id="monthAfterOutput">0円</output></div>
            <div class="advance-breakdown" id="monthAfterBreakdown"></div>
            <div class="reference-note" id="monthAfterNote"></div>
            <label class="toggle">
              <input id="includeMonthAfter" type="checkbox">
              請求に含める
            </label>
          </div>
          <div class="line-item">
            <div class="line-title">フリーレント控除 <output id="freeRentOutput">0円</output></div>
            <div class="grid-2">
              <label>数値
                <input id="freeRentValue" type="number" inputmode="decimal" min="0" step="0.5" value="0">
              </label>
              <label>指定方法
                <select id="freeRentMode">
                  <option value="months">ヶ月</option>
                  <option value="days">日数</option>
                </select>
              </label>
            </div>
            <div class="reference-note" id="freeRentNote"></div>
            <div class="grid-2">
              <label>無料対象
                <select id="freeRentTarget">
                  <option value="rent">賃料のみ</option>
                  <option value="rentManagement">賃料+管理費</option>
                </select>
              </label>
            </div>
          </div>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>備考</h2>
        </div>
        <div class="fields">
          <label>お客様向けメモ
            <textarea id="memo" placeholder="例: 火災保険・保証会社は審査内容により変動する場合があります。"></textarea>
          </label>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>発行元情報</h2>
          <strong class="section-total" id="issuerStorageStatus">この端末内に保存</strong>
        </div>
        <div class="fields" id="issuerFields">
          <div class="grid-2">
            <label>会社名
              <input id="issuerCompany" autocomplete="organization" placeholder="例: 株式会社〇〇不動産">
            </label>
            <label>担当者名
              <input id="issuerStaff" autocomplete="name" placeholder="例: 山田 太郎">
            </label>
          </div>
          <label>住所
            <input id="issuerAddress" autocomplete="street-address" placeholder="例: 東京都〇〇区〇〇1-2-3">
          </label>
          <div class="grid-2">
            <label>電話番号
              <input id="issuerTel" type="tel" autocomplete="tel" placeholder="例: 03-1234-5678">
            </label>
            <label>FAX
              <input id="issuerFax" type="tel" placeholder="例: 03-1234-5679">
            </label>
          </div>
          <label class="toggle">
            <input id="issuerVisible" type="checkbox" checked>
            概算書に発行元情報を表示
          </label>
        </div>
        <div class="small-action">
          <button class="ghost-button danger" id="clearIssuer" type="button">端末内の発行元情報を削除</button>
        </div>
      </section>
    </main>

    <div class="actions">
      <button id="shareImage" type="button">画像で共有</button>
      <button class="secondary" id="saveImage" type="button">画像保存</button>
      <button class="secondary" id="printPdf" type="button">PDF保存/共有</button>
    </div>
  </div>

  <div id="shareCard"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="preview-sheet" id="imagePreview" role="dialog" aria-modal="true" aria-labelledby="previewTitle" aria-hidden="true">
    <div class="preview-panel" tabindex="-1">
      <h2 class="sr-only" id="previewTitle">共有画像プレビュー</h2>
      <div class="preview-actions">
        <a id="previewDownload" href="#" download="賃貸初期費用概算.png">画像を保存</a>
        <button id="closePreview" type="button">閉じる</button>
      </div>
      <img id="previewImage" alt="賃貸初期費用概算画像">
    </div>
  </div>

  <script>
    const byId = (id) => document.getElementById(id);
    const money = (value) => Math.max(0, Math.round(Number(value) || 0));
    const parseMoneyInput = (value, assumeMan = false) => {
      const normalized = String(value ?? "").trim().replace(/[,\s¥￥円]/g, "");
      const hasMan = normalized.endsWith("万");
      const numeric = Number(hasMan ? normalized.slice(0, -1) : normalized);
      if (!Number.isFinite(numeric)) return 0;
      const useMan = hasMan || (assumeMan && numeric > 0 && numeric < 1000);
      return numeric * (useMan ? 10000 : 1);
    };
    const fmt = (value) => {
      const amount = Math.round(Number(value) || 0);
      return `${amount < 0 ? "-" : ""}${new Intl.NumberFormat("ja-JP").format(Math.abs(amount))}円`;
    };
    const formatMoneyInputValue = (value) => {
      const amount = money(value);
      if (amount >= 10000) return `${Number((amount / 10000).toFixed(4))}万`;
      return amount > 0 ? fmt(amount) : "";
    };
    const rent = () => money(parseMoneyInput(byId("rent").value, true));
    const management = () => money(parseMoneyInput(byId("management").value, true));
    const housingMonthly = () => rent() + management();
    const monthly = () => housingMonthly() + monthlyFeesTotal();
    const guaranteeBaseMonthly = () => housingMonthly() + guaranteeMonthlyFeesTotal();

    const contractDefs = [
      { id: "deposit", label: "敷金", type: "rentMonthOrAmount", mode: "month", value: "1" },
      { id: "keyMoney", label: "礼金", type: "rentMonthOrAmount", mode: "month", value: "1" },
      { id: "brokerage", label: "仲介手数料", type: "brokerage", value: "1.1" },
      { id: "guarantee", label: "初回保証料", type: "monthlyPercentOrAmount", mode: "percent", value: "50" },
      { id: "keyExchange", label: "鍵交換代", type: "amountOnly", value: "" },
      { id: "fireInsurance", label: "火災保険料", type: "amountOnly", value: "" }
    ];
    const monthlyDefaults = [
      { label: "口座振替事務手数料", value: "", mode: "amount", includeInAdvance: false, includeInGuarantee: false },
      { label: "月次保証料", value: "", mode: "percent", includeInAdvance: false, includeInGuarantee: false },
      { label: "町会費", value: "", mode: "amount", includeInAdvance: true, includeInGuarantee: true },
      { label: "火災保険料", value: "", mode: "amount", includeInAdvance: true, includeInGuarantee: true },
      { label: "24時間サポート", value: "", mode: "amount", includeInAdvance: true, includeInGuarantee: true }
    ];
    const issuerStorageKey = "chintai-cost-calculator:issuer:v1";
    const issuerFieldIds = ["issuerCompany", "issuerStaff", "issuerAddress", "issuerTel", "issuerFax"];
    let extraItemSequence = 0;
    let persistentStorageRequested = false;
    let previewReturnFocus = null;

    function makeLineItem(def) {
      const { id, label, type, mode = "amount", value = "" } = def;
      const wrap = document.createElement("div");
      wrap.className = "line-item";
      wrap.dataset.id = id;
      if (type === "rentMonthOrAmount") {
        wrap.innerHTML = `
          <div class="line-title">${label}<output id="${id}Output">0円</output></div>
          <div class="mode-row compact">
            <label>数値
              <input id="${id}Value" type="text" inputmode="decimal" data-money data-money-mode="${id}Mode" data-assume-man="true">
            </label>
            <label>指定方法
              <select id="${id}Mode">
                <option value="month">ヶ月</option>
                <option value="amount">金額指定</option>
              </select>
            </label>
          </div>`;
        wrap.querySelector(`#${id}Mode`).value = mode;
        wrap.querySelector(`#${id}Value`).value = value;
      } else if (type === "brokerage") {
        wrap.innerHTML = `
          <div class="line-title">${label}<output id="${id}Output">0円</output></div>
          <div class="mode-row compact">
            <label>数値
              <input id="${id}Value" type="text" inputmode="decimal" data-money data-money-mode="${id}Mode" data-assume-man="true">
            </label>
            <label>指定方法
              <select id="${id}Mode">
                <option value="month">ヶ月</option>
                <option value="amount">金額指定</option>
              </select>
            </label>
          </div>`;
        wrap.querySelector(`#${id}Mode`).value = "month";
        wrap.querySelector(`#${id}Value`).value = value;
      } else if (type === "monthlyPercentOrAmount") {
        const detail = id === "guarantee" ? `<div class="reference-note" id="${id}Note"></div>` : "";
        wrap.innerHTML = `
          <div class="line-title">${label}<output id="${id}Output">0円</output></div>
          <div class="mode-row compact">
            <label>数値
              <input id="${id}Value" type="text" inputmode="decimal" data-money data-money-mode="${id}Mode" data-assume-man="true">
            </label>
            <label>指定方法
              <select id="${id}Mode">
                <option value="percent">月額総額%</option>
                <option value="amount">金額指定</option>
              </select>
            </label>
          </div>
          ${detail}`;
        wrap.querySelector(`#${id}Mode`).value = mode;
        wrap.querySelector(`#${id}Value`).value = value;
      } else {
        const detailField = id === "fireInsurance" ? `
          <label>契約年数
            <input id="${id}Years" type="number" inputmode="decimal" min="0" step="0.5" placeholder="例: 2">
          </label>` : "";
        wrap.innerHTML = `
          <div class="line-title">${label}<output id="${id}Output">0円</output></div>
          <div class="${detailField ? "grid-2" : ""}">
            <label>金額
              <input id="${id}AmountValue" type="text" inputmode="decimal" value="${value}" data-money data-assume-man="true" placeholder="例: 3.3万">
            </label>
            ${detailField}
          </div>`;
      }
      return wrap;
    }

    function makeExtraItem(index, label = "", value = "") {
      const id = `extra${index}`;
      const wrap = document.createElement("div");
      wrap.className = "line-item";
      wrap.dataset.extra = id;
      wrap.innerHTML = `
        <div class="line-title extra-title">
          <span id="${id}Title">${label || "任意項目"}</span>
          <span class="extra-title-actions">
            <output id="${id}Output">0円</output>
            <button class="remove-row" type="button" data-remove-extra aria-label="この項目を削除">削除</button>
          </span>
        </div>
        <div class="grid-2">
          <label>項目名
            <input id="${id}Name" value="${label}" placeholder="例: 室内清掃費">
          </label>
          <label>金額
            <input id="${id}Value" type="text" inputmode="decimal" value="${value}" data-money data-assume-man="true" placeholder="例: 8.8万">
          </label>
        </div>`;
      return wrap;
    }

    function addExtraItem(label = "", value = "", focus = false) {
      const item = makeExtraItem(extraItemSequence++, label, value);
      byId("extraItems").appendChild(item);
      calculate();
      if (focus) item.querySelector("input").focus();
      return item;
    }

    function makeMonthlyItem(index, label = "", value = "", includeInAdvance = true, includeInGuarantee = true, mode = "amount") {
      const id = `monthly${index}`;
      const wrap = document.createElement("details");
      wrap.className = "line-item monthly-item";
      wrap.dataset.monthly = id;
      const isFlexible = mode === "percent" || label === "月次保証料";
      wrap.innerHTML = `
        <summary class="monthly-summary">
          <span class="monthly-summary-copy">
            <strong id="${id}Title">${label || "月次費用"}</strong>
            <span class="monthly-flags">
              ${label === "月次保証料" ? `<span class="state-pill">任意設定</span>` : ""}
              <span class="state-pill" id="${id}AdvanceState"></span>
              <span class="state-pill" id="${id}GuaranteeState"></span>
            </span>
          </span>
          <output id="${id}Output">0円/月</output>
        </summary>
        <div class="monthly-edit">
          <div class="grid-2">
            <label>項目名
              <input id="${id}Name" value="${label}" placeholder="例: 町会費">
            </label>
            <label>${isFlexible ? "数値" : "月額"}
              <input id="${id}Value" type="text" inputmode="decimal" value="${value}" data-money data-money-mode="${id}Mode" placeholder="0">
            </label>
          </div>
          ${isFlexible ? `
            <label>指定方法
              <select id="${id}Mode">
                <option value="percent">総賃料%</option>
                <option value="amount">金額指定</option>
              </select>
            </label>` : `<input id="${id}Mode" type="hidden" value="amount">`}
          <label class="toggle">
            <input id="${id}IncludeAdvance" type="checkbox" ${includeInAdvance ? "checked" : ""}>
            <span class="toggle-copy">前賃料に含める</span>
            <strong class="toggle-status" id="${id}AdvanceToggleState"></strong>
          </label>
          <label class="toggle">
            <input id="${id}IncludeGuarantee" type="checkbox" ${includeInGuarantee ? "checked" : ""}>
            <span class="toggle-copy">初回保証料の算定に含める</span>
            <strong class="toggle-status" id="${id}GuaranteeToggleState"></strong>
          </label>
        </div>`;
      wrap.querySelector(`#${id}Mode`).value = mode;
      return wrap;
    }

    function lineAmount(id) {
      const def = contractDefs.find((item) => item.id === id);
      if (!def) return 0;
      if (def.type === "rentMonthOrAmount") {
        const mode = byId(`${id}Mode`).value;
        const value = Number(byId(`${id}Value`).value) || 0;
        return mode === "month" ? money(rent() * value) : money(parseMoneyInput(byId(`${id}Value`).value, true));
      }
      if (def.type === "brokerage") {
        const mode = byId(`${id}Mode`).value;
        const value = Number(byId(`${id}Value`).value) || 0;
        return mode === "month" ? money(rent() * value) : money(parseMoneyInput(byId(`${id}Value`).value, true));
      }
      if (def.type === "monthlyPercentOrAmount") {
        const mode = byId(`${id}Mode`).value;
        const value = Number(byId(`${id}Value`).value) || 0;
        return mode === "percent" ? money(guaranteeBaseMonthly() * value / 100) : money(parseMoneyInput(byId(`${id}Value`).value, true));
      }
      return money(parseMoneyInput(byId(`${id}AmountValue`).value, true));
    }

    function parseLocalDate(value) {
      if (!value) return null;
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function addDays(date, days) {
      const next = new Date(date);
      next.setDate(next.getDate() + days);
      return next;
    }

    function daysIn(date) {
      return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
    }

    function monthLabel(date) {
      return `${date.getFullYear()}年${date.getMonth() + 1}月`;
    }

    function monthlyRows() {
      return Array.from(document.querySelectorAll("[data-monthly]"));
    }

    function monthlyFeeAmount(row) {
      const id = row.dataset.monthly;
      const value = Number(byId(`${id}Value`).value) || 0;
      return byId(`${id}Mode`).value === "percent" ? money(housingMonthly() * value / 100) : money(parseMoneyInput(byId(`${id}Value`).value));
    }

    function monthlyFeesTotal() {
      return monthlyRows().reduce((total, row) => total + monthlyFeeAmount(row), 0);
    }

    function includedMonthlyFeesTotal() {
      return monthlyRows().reduce((total, row) => {
        const id = row.dataset.monthly;
        return total + (byId(`${id}IncludeAdvance`).checked ? monthlyFeeAmount(row) : 0);
      }, 0);
    }

    function isGuaranteeExcludedMonthly(row) {
      const id = row.dataset.monthly;
      return !byId(`${id}IncludeGuarantee`).checked;
    }

    function guaranteeMonthlyFeesTotal() {
      return monthlyRows().reduce((total, row) => total + (isGuaranteeExcludedMonthly(row) ? 0 : monthlyFeeAmount(row)), 0);
    }

    function monthlyFeeLines() {
      return monthlyRows().map((row) => {
        const id = row.dataset.monthly;
        return {
          name: byId(`${id}Name`).value.trim() || "月次費用",
          amount: monthlyFeeAmount(row),
          includeInAdvance: byId(`${id}IncludeAdvance`).checked,
          includeInGuarantee: !isGuaranteeExcludedMonthly(row)
        };
      }).filter((item) => item.amount > 0);
    }

    function monthlyCostLines() {
      const housingLines = [
        { name: "賃料", amount: rent(), detail: "" },
        { name: "管理費・共益費", amount: management(), detail: "" }
      ];
      const additionalLines = monthlyFeeLines().map((item) => ({
        ...item,
        detail: `前賃料: ${item.includeInAdvance ? "含む" : "対象外"} / 保証料: ${item.includeInGuarantee ? "算定対象" : "算定外"}`
      }));
      return [...housingLines, ...additionalLines].filter((item) => item.amount > 0);
    }

    function freeRentDays(start) {
      if (!start) return 0;
      const value = Number(byId("freeRentValue").value) || 0;
      if (byId("freeRentMode").value === "months") {
        return Math.round(value * daysIn(start));
      }
      return Math.max(0, value);
    }

    function chargeForPeriod(start, end, freeEnd) {
      if (!start || !end || end < start) {
        return { amount: 0, gross: 0, free: 0, charged: 0, days: 0, label: "" };
      }
      const freeMgmt = byId("freeRentTarget").value === "rentManagement";
      let gross = 0;
      let free = 0;
      for (let day = new Date(start); day <= end; day = addDays(day, 1)) {
        const dailyRent = rent() / daysIn(day);
        const dailyManagement = management() / daysIn(day);
        const dailyIncludedMonthly = includedMonthlyFeesTotal() / daysIn(day);
        gross += dailyRent + dailyManagement + dailyIncludedMonthly;
        const isFree = freeEnd && day < freeEnd;
        if (isFree) {
          free += dailyRent + (freeMgmt ? dailyManagement : 0);
        }
      }
      const roundedGross = money(gross);
      const roundedFree = Math.min(roundedGross, money(free));
      const roundedCharged = roundedGross - roundedFree;
      return {
        amount: roundedCharged,
        gross: roundedGross,
        free: roundedFree,
        charged: roundedCharged,
        days: Math.round((end - start) / 86400000) + 1,
        label: monthLabel(start)
      };
    }

    function advanceRentBreakdown() {
      const start = parseLocalDate(byId("contractStartDate").value);
      if (!start) {
        return {
          current: { amount: 0, gross: 0, free: 0, charged: 0, days: 0, label: "" },
          next: { amount: 0, referenceAmount: 0, included: true, gross: 0, free: 0, charged: 0, days: 0, label: "" },
          monthAfter: { amount: 0, referenceAmount: 0, included: false, gross: 0, free: 0, charged: 0, days: 0, label: "" },
          freeTotal: 0
        };
      }
      const freeDays = freeRentDays(start);
      const freeEnd = freeDays > 0 ? addDays(start, freeDays) : null;
      const currentEnd = new Date(start.getFullYear(), start.getMonth() + 1, 0);
      const nextStart = new Date(start.getFullYear(), start.getMonth() + 1, 1);
      const nextEnd = new Date(start.getFullYear(), start.getMonth() + 2, 0);
      const afterStart = new Date(start.getFullYear(), start.getMonth() + 2, 1);
      const afterEnd = new Date(start.getFullYear(), start.getMonth() + 3, 0);
      const current = chargeForPeriod(start, currentEnd, freeEnd);
      const nextCalc = chargeForPeriod(nextStart, nextEnd, freeEnd);
      const monthAfterCalc = chargeForPeriod(afterStart, afterEnd, freeEnd);
      const nextIncluded = byId("includeNextMonth").checked;
      const monthAfterIncluded = byId("includeMonthAfter").checked;
      const next = { ...nextCalc, included: nextIncluded, referenceAmount: nextCalc.amount, amount: nextIncluded ? nextCalc.amount : 0 };
      const monthAfter = { ...monthAfterCalc, included: monthAfterIncluded, referenceAmount: monthAfterCalc.amount, amount: monthAfterIncluded ? monthAfterCalc.amount : 0 };
      return {
        current,
        next,
        monthAfter,
        freeTotal: current.free + (nextIncluded ? nextCalc.free : 0) + (monthAfterIncluded ? monthAfterCalc.free : 0)
      };
    }

    function freeRentTargetLabel() {
      return byId("freeRentTarget").value === "rentManagement" ? "賃料+管理費" : "賃料のみ";
    }

    function formatShortDate(date) {
      return `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()}`;
    }

    function freeRentPeriodLabel() {
      const start = parseLocalDate(byId("contractStartDate").value);
      const days = freeRentDays(start);
      if (!start || days <= 0) return "";
      const end = addDays(start, days - 1);
      return `${formatShortDate(start)}〜${formatShortDate(end)}（${days}日間）`;
    }

    function freeRentShareLabel() {
      const period = freeRentPeriodLabel();
      return period ? `フリーレント: ${freeRentTargetLabel()} / ${period}` : `フリーレント: ${freeRentTargetLabel()}`;
    }

    function advanceBreakdownHtml(period, included = true) {
      const chargeLabel = included ? "請求額" : "参考請求額";
      const chargeAmount = included ? period.amount : period.referenceAmount;
      return `
        <div>請求前 <strong>${fmt(period.gross)}</strong></div>
        <div>フリーレント控除 <strong>${fmt(period.free ? -period.free : 0)}</strong>（${freeRentTargetLabel()}）</div>
        <div>${chargeLabel} <strong>${fmt(chargeAmount)}</strong></div>`;
    }

    function advanceBreakdownText(period, included = true) {
      const chargeLabel = included ? "請求" : "参考";
      const chargeAmount = included ? period.amount : period.referenceAmount;
      return `請求前 ${fmt(period.gross)} / 控除 ${fmt(period.free ? -period.free : 0)} / ${chargeLabel} ${fmt(chargeAmount)}`;
    }

    function advanceReferenceLines(totals) {
      if (totals.freeTotal <= 0) return [];
      return [
        { label: "当月日割前賃料", period: totals.advance.current, included: true },
        { label: "翌月分前賃料", period: totals.advance.next, included: totals.advance.next.included },
        { label: "翌々月分前賃料", period: totals.advance.monthAfter, included: totals.advance.monthAfter.included }
      ].filter((item) => item.period.gross > 0 || item.period.free > 0 || item.included);
    }

    function extraRows() {
      return Array.from(document.querySelectorAll("[data-extra]"));
    }

    function setHidden(id, hidden) {
      const el = byId(id);
      if (el) el.hidden = hidden;
    }

    function syncUiState() {
      const hasContractStartDate = Boolean(parseLocalDate(byId("contractStartDate").value));
      setHidden("advanceDatePrompt", hasContractStartDate);
      byId("currentAdvanceFields").classList.toggle("is-waiting", !hasContractStartDate);
      const freeMode = byId("freeRentMode").value;
      byId("freeRentValue").step = freeMode === "months" ? "0.5" : "1";
      const freeRentRule = freeMode === "months"
        ? `${freeRentTargetLabel()}を対象に、契約開始月の日数を基準に無料日数へ換算します。`
        : `${freeRentTargetLabel()}を対象に、契約開始日から指定日数分を無料として計算します。`;
      const freeRentPeriod = freeRentPeriodLabel();
      byId("freeRentNote").textContent = `${freeRentRule}${freeRentPeriod ? ` 無料期間: ${freeRentPeriod}` : ""}`;
      monthlyRows().forEach((row) => {
        const id = row.dataset.monthly;
        const includeInAdvance = byId(`${id}IncludeAdvance`).checked;
        const includeInGuarantee = byId(`${id}IncludeGuarantee`).checked;
        const advanceState = byId(`${id}AdvanceState`);
        const guaranteeState = byId(`${id}GuaranteeState`);
        advanceState.textContent = includeInAdvance ? "前賃料: 含む" : "前賃料: 対象外";
        guaranteeState.textContent = includeInGuarantee ? "保証料: 算定対象" : "保証料: 算定外";
        advanceState.classList.toggle("is-on", includeInAdvance);
        guaranteeState.classList.toggle("is-on", includeInGuarantee);
        byId(`${id}AdvanceToggleState`).textContent = includeInAdvance ? "含む" : "含めない";
        byId(`${id}GuaranteeToggleState`).textContent = includeInGuarantee ? "算定対象" : "算定外";
      });
      byId("includeNextMonth").closest(".line-item").classList.toggle("is-muted", !byId("includeNextMonth").checked);
      byId("includeMonthAfter").closest(".line-item").classList.toggle("is-muted", !byId("includeMonthAfter").checked);
      document.querySelectorAll(".toggle input").forEach((input) => {
        input.closest(".toggle").classList.toggle("is-on", input.checked);
      });
    }

    function calculate() {
      syncUiState();
      byId("rentBaseTotal").textContent = `${fmt(monthly())}/月`;
      byId("monthlyFeesTotal").textContent = `${fmt(monthlyFeesTotal())}/月`;
      monthlyRows().forEach((row) => {
        const id = row.dataset.monthly;
        const amount = monthlyFeeAmount(row);
        byId(`${id}Title`).textContent = byId(`${id}Name`).value.trim() || "月次費用";
        byId(`${id}Output`).textContent = amount > 0 ? `${fmt(amount)}/月` : "未設定";
      });
      let baseContractTotal = 0;
      contractDefs.forEach((def) => {
        const amount = lineAmount(def.id);
        baseContractTotal += amount;
        byId(`${def.id}Output`).textContent = fmt(amount);
      });
      if (byId("guaranteeNote")) {
        const excluded = monthlyFeeLines().filter((item) => !item.includeInGuarantee).map((item) => item.name);
        byId("guaranteeNote").textContent = byId("guaranteeMode").value === "percent"
          ? `算定月額: ${fmt(guaranteeBaseMonthly())}/月${excluded.length ? `（${excluded.join("・")}は除外）` : ""}`
          : "";
      }

      const advance = advanceRentBreakdown();
      byId("proratedOutput").textContent = fmt(advance.current.amount);
      byId("nextMonthOutput").textContent = advance.next.included ? fmt(advance.next.amount) : "対象外";
      byId("nextMonthNote").textContent = advance.next.included ? "" : "請求に含めない";
      byId("monthAfterOutput").textContent = advance.monthAfter.included ? fmt(advance.monthAfter.amount) : "対象外";
      byId("monthAfterNote").textContent = advance.monthAfter.included ? "" : "請求に含めない";
      byId("freeRentOutput").textContent = fmt(-advance.freeTotal);
      const showFreeBreakdown = advance.freeTotal > 0;
      byId("currentAdvanceBreakdown").innerHTML = showFreeBreakdown ? advanceBreakdownHtml(advance.current, true) : "";
      byId("nextMonthBreakdown").innerHTML = showFreeBreakdown ? advanceBreakdownHtml(advance.next, advance.next.included) : "";
      byId("monthAfterBreakdown").innerHTML = showFreeBreakdown ? advanceBreakdownHtml(advance.monthAfter, advance.monthAfter.included) : "";
      byId("currentChargeDays").value = `${advance.current.days}日`;
      const startDate = parseLocalDate(byId("contractStartDate").value);
      byId("currentFreeDays").value = `${Math.round(advance.current.free > 0 ? Math.min(freeRentDays(startDate), advance.current.days) : 0)}日`;
      byId("daysInMonth").value = startDate ? `${daysIn(startDate)}日` : "0日";
      const advanceTotal = advance.current.amount + advance.next.amount + advance.monthAfter.amount;

      let extraTotal = 0;
      extraRows().forEach((row) => {
        const id = row.dataset.extra;
        const amount = money(parseMoneyInput(byId(`${id}Value`).value, true));
        extraTotal += amount;
        byId(`${id}Title`).textContent = byId(`${id}Name`).value.trim() || "任意項目";
        byId(`${id}Output`).textContent = fmt(amount);
      });

      const contractTotal = baseContractTotal + extraTotal;
      const grand = contractTotal + advanceTotal;
      byId("contractTotal").textContent = fmt(contractTotal);
      byId("advanceTotal").textContent = fmt(advanceTotal);
      byId("extraTotal").textContent = fmt(extraTotal);
      byId("grandTotalTop").textContent = fmt(grand);
      return {
        contractTotal,
        advanceTotal,
        extraTotal,
        grand,
        proratedAmount: advance.current.amount,
        next: advance.next.amount,
        monthAfter: advance.monthAfter.amount,
        freeTotal: advance.freeTotal,
        advance
      };
    }

    function rowsForShare() {
      const totals = calculate();
      const rows = contractDefs.map((def) => [displayContractLabel(def), lineAmount(def.id)]);
      rows.push(
        ["当月日割前賃料", totals.proratedAmount],
        ["翌月分前賃料", totals.next],
        ["翌々月分前賃料", totals.monthAfter]
      );
      extraRows().forEach((row) => {
        const id = row.dataset.extra;
        const name = byId(`${id}Name`).value.trim() || "追加費用";
        rows.push([name, money(parseMoneyInput(byId(`${id}Value`).value, true))]);
      });
      return rows.filter(([, amount]) => amount !== 0);
    }

    function displayContractLabel(def) {
      if (def.id === "fireInsurance") {
        const years = Number(byId("fireInsuranceYears")?.value) || 0;
        if (years > 0) return `${def.label}（${years}年）`;
      }
      return def.label;
    }

    function displayProperty() {
      const property = byId("propertyName").value.trim();
      const room = byId("roomNumber").value.trim();
      return [property || "物件名未入力", room].filter(Boolean).join(" ");
    }

    function displayContractStart() {
      const date = parseLocalDate(byId("contractStartDate").value);
      if (!date) return "";
      return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
    }

    function displayCustomerName() {
      const value = byId("customerName").value.trim();
      if (!value) return "";
      return value.endsWith("様") ? value : `${value}様`;
    }

    function normalizeCustomerName() {
      const input = byId("customerName");
      const value = input.value.trim();
      if (value && !value.endsWith("様")) input.value = `${value}様`;
    }

    function formatMoneyInputField(input) {
      const modeId = input.dataset.moneyMode;
      if (modeId && byId(modeId)?.value !== "amount") return;
      const raw = input.value.trim();
      if (!raw) return;
      const amount = money(parseMoneyInput(raw, input.dataset.assumeMan === "true"));
      input.value = formatMoneyInputValue(amount);
    }

    function issuerInfo() {
      return {
        company: byId("issuerCompany").value.trim(),
        staff: byId("issuerStaff").value.trim(),
        address: byId("issuerAddress").value.trim(),
        tel: byId("issuerTel").value.trim(),
        fax: byId("issuerFax").value.trim(),
        visible: byId("issuerVisible").checked
      };
    }

    function hasIssuerInfo(info = issuerInfo()) {
      return [info.company, info.staff, info.address, info.tel, info.fax].some(Boolean);
    }

    async function requestPersistentStorage() {
      if (persistentStorageRequested || !navigator.storage?.persist) return;
      persistentStorageRequested = true;
      try {
        const isPersistent = navigator.storage.persisted ? await navigator.storage.persisted() : false;
        if (!isPersistent) await navigator.storage.persist();
      } catch (error) {
        // localStorage remains usable even when persistent mode is unavailable.
      }
    }

    function saveIssuerInfo() {
      clearTimeout(saveIssuerInfo.timer);
      saveIssuerInfo.timer = setTimeout(() => {
        try {
          localStorage.setItem(issuerStorageKey, JSON.stringify(issuerInfo()));
          byId("issuerStorageStatus").textContent = "この端末内に保存済み";
          requestPersistentStorage();
        } catch (error) {
          byId("issuerStorageStatus").textContent = "端末内に保存できません";
        }
      }, 150);
    }

    function loadIssuerInfo() {
      try {
        const saved = JSON.parse(localStorage.getItem(issuerStorageKey) || "null");
        if (!saved || typeof saved !== "object") return;
        issuerFieldIds.forEach((id) => {
          const key = id.replace("issuer", "").toLowerCase();
          byId(id).value = typeof saved[key] === "string" ? saved[key] : "";
        });
        byId("issuerVisible").checked = saved.visible !== false;
        byId("issuerStorageStatus").textContent = "この端末内に保存済み";
      } catch (error) {
        byId("issuerStorageStatus").textContent = "保存情報を読み込めません";
      }
    }

    function clearIssuerInfo() {
      if (!window.confirm("この端末に保存した発行元情報を削除しますか？")) return;
      try {
        localStorage.removeItem(issuerStorageKey);
      } catch (error) {
        // Clear the visible fields even if browser storage is unavailable.
      }
      issuerFieldIds.forEach((id) => { byId(id).value = ""; });
      byId("issuerVisible").checked = true;
      byId("issuerStorageStatus").textContent = "この端末内に保存";
      calculate();
      showToast("端末内の発行元情報を削除しました。");
    }

    function classicContractBasis(def) {
      if (["deposit", "keyMoney", "brokerage"].includes(def.id) && byId(`${def.id}Mode`)?.value === "month") {
        return `（${byId(`${def.id}Value`).value || 0}ヶ月分）`;
      }
      if (def.id === "guarantee" && byId("guaranteeMode").value === "percent") {
        return `（算定月額の${byId("guaranteeValue").value || 0}%）`;
      }
      return "";
    }

    function classicDocumentRows(totals) {
      const rows = contractDefs.map((def) => ({
        label: displayContractLabel(def),
        basis: classicContractBasis(def),
        amount: lineAmount(def.id)
      })).filter((item) => item.amount !== 0);
      const start = parseLocalDate(byId("contractStartDate").value);
      if (start) {
        const currentEnd = new Date(start.getFullYear(), start.getMonth() + 1, 0);
        if (totals.advance.current.gross > 0) {
          rows.push({
            label: `${start.getMonth() + 1}月分 日割前賃料`,
            basis: `（${start.getMonth() + 1}/${start.getDate()}〜${currentEnd.getMonth() + 1}/${currentEnd.getDate()}）`,
            amount: totals.advance.current.gross
          });
        }
        if (totals.advance.next.included && totals.advance.next.gross > 0) {
          const next = new Date(start.getFullYear(), start.getMonth() + 1, 1);
          rows.push({ label: `${next.getMonth() + 1}月分 前賃料`, basis: "", amount: totals.advance.next.gross });
        }
        if (totals.advance.monthAfter.included && totals.advance.monthAfter.gross > 0) {
          const monthAfter = new Date(start.getFullYear(), start.getMonth() + 2, 1);
          rows.push({ label: `${monthAfter.getMonth() + 1}月分 前賃料`, basis: "", amount: totals.advance.monthAfter.gross });
        }
        if (totals.freeTotal > 0) {
          rows.push({ label: "フリーレント控除", basis: `（${freeRentTargetLabel()} / ${freeRentPeriodLabel()}）`, amount: -totals.freeTotal });
        }
      }
      extraRows().forEach((row) => {
        const id = row.dataset.extra;
        const amount = money(parseMoneyInput(byId(`${id}Value`).value, true));
        if (amount !== 0) rows.push({ label: byId(`${id}Name`).value.trim() || "追加費用", basis: "", amount });
      });
      return rows;
    }

    function drawClassicCell(ctx, x, y, width, height, text, options = {}) {
      const {
        fill = "#ffffff",
        color = "#050505",
        align = "left",
        fontSize = 18,
        minFontSize = 12,
        weight = "normal",
        family = "-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif",
        padding = 10,
        lineWidth = 1.2
      } = options;
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, width, height);
      ctx.strokeStyle = "#111111";
      ctx.lineWidth = lineWidth;
      ctx.strokeRect(x, y, width, height);
      ctx.save();
      ctx.beginPath();
      ctx.rect(x + 1, y + 1, Math.max(0, width - 2), Math.max(0, height - 2));
      ctx.clip();
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      const textX = align === "right" ? x + width - padding : align === "center" ? x + width / 2 : x + padding;
      drawFittedText(ctx, text, textX, y + height / 2, Math.max(0, width - padding * 2), fontSize, minFontSize, weight, family);
      ctx.restore();
    }

    function drawInfoBox(ctx, x, y, w, label, value, color, fill = "#ffffff", stroke = "#d9e0e8") {
      ctx.fillStyle = fill;
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2;
      ctx.fillRect(x, y, w, 104);
      ctx.strokeRect(x, y, w, 104);
      ctx.fillStyle = "#4b4b46";
      ctx.font = "21px 'Yu Mincho', 'Hiragino Mincho ProN', serif";
      ctx.fillText(label, x + 24, y + 36);
      ctx.fillStyle = color;
      ctx.font = "bold 35px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText(value, x + 24, y + 80);
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }

    function truncateText(ctx, text, maxWidth) {
      const value = String(text);
      if (ctx.measureText(value).width <= maxWidth) return value;
      let shortened = value;
      while (shortened.length > 1 && ctx.measureText(`${shortened}…`).width > maxWidth) {
        shortened = shortened.slice(0, -1);
      }
      return `${shortened}…`;
    }

    function drawFittedText(ctx, text, x, y, maxWidth, maxSize, minSize, weight = "normal", family = "-apple-system, BlinkMacSystemFont, sans-serif") {
      let size = maxSize;
      do {
        ctx.font = `${weight} ${size}px ${family}`;
        if (ctx.measureText(String(text)).width <= maxWidth) break;
        size -= 1;
      } while (size >= minSize);
      ctx.fillText(truncateText(ctx, text, maxWidth), x, y);
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 3) {
      const chars = String(text).split("");
      const lines = [];
      let line = "";
      for (let i = 0; i < chars.length; i++) {
        const test = line + chars[i];
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = chars[i];
          if (lines.length >= maxLines - 1) {
            line = truncateText(ctx, line + chars.slice(i + 1).join(""), maxWidth);
            break;
          }
        } else {
          line = test;
        }
      }
      if (line && lines.length < maxLines) lines.push(line);
      lines.slice(0, maxLines).forEach((value, index) => ctx.fillText(value, x, y + index * lineHeight));
    }

    function dataUrlToBlob(dataUrl) {
      const [meta, data] = dataUrl.split(",");
      const mime = meta.match(/:(.*?);/)?.[1] || "image/png";
      const binary = atob(data);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type: mime });
    }

    function makeImageFile() {
      const canvas = makeCanvas();
      const dataUrl = canvas.toDataURL("image/png");
      const blob = dataUrlToBlob(dataUrl);
      const file = new File([blob], "賃貸初期費用概算.png", { type: "image/png" });
      return { dataUrl, blob, file };
    }

    function validateForExport() {
      const fields = [
        { id: "propertyName", label: "物件名", valid: (input) => input.value.trim().length > 0 },
        { id: "contractStartDate", label: "契約開始日", valid: (input) => Boolean(input.value) },
        { id: "rent", label: "賃料", valid: () => rent() > 0 }
      ];
      const invalid = fields.filter((item) => !item.valid(byId(item.id)));
      fields.forEach((item) => byId(item.id).setAttribute("aria-invalid", invalid.some((entry) => entry.id === item.id) ? "true" : "false"));
      if (!invalid.length) return true;
      const first = byId(invalid[0].id);
      first.focus();
      first.scrollIntoView({ behavior: "smooth", block: "center" });
      showToast(`${invalid.map((item) => item.label).join("・")}を入力してから出力してください。`);
      return false;
    }

    async function shareImage() {
      if (!validateForExport()) return;
      const button = byId("shareImage");
      button.disabled = true;
      button.textContent = "作成中...";
      try {
        const { dataUrl, file } = makeImageFile();

        if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
          try {
            await navigator.share({ files: [file], title: "賃貸初期費用概算" });
            showToast("共有メニューを開きました。");
            return;
          } catch (error) {
            if (error.name === "AbortError") return;
          }
        }

        showImagePreview(dataUrl, file.name);
        showToast("共有が使えない環境なので画像プレビューを表示しました。");
      } catch (error) {
        showToast(`画像作成に失敗しました: ${error.message}`);
      } finally {
        button.disabled = false;
        button.textContent = "画像で共有";
      }
    }

    async function saveImage() {
      if (!validateForExport()) return;
      const button = byId("saveImage");
      button.disabled = true;
      button.textContent = "作成中...";
      try {
        const { dataUrl, blob, file } = makeImageFile();
        showImagePreview(dataUrl, file.name);
        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = objectUrl;
        link.download = file.name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
        showToast("保存が始まらない場合は、表示された画像を長押しして保存してください。");
      } catch (error) {
        showToast(`画像作成に失敗しました: ${error.message}`);
      } finally {
        button.disabled = false;
        button.textContent = "画像保存";
      }
    }

    function showImagePreview(dataUrl, filename) {
      previewReturnFocus = document.activeElement;
      byId("previewImage").src = dataUrl;
      byId("previewDownload").href = dataUrl;
      byId("previewDownload").download = filename;
      const preview = byId("imagePreview");
      preview.classList.add("show");
      preview.setAttribute("aria-hidden", "false");
      byId("closePreview").focus();
    }

    function closeImagePreview() {
      const preview = byId("imagePreview");
      preview.classList.remove("show");
      preview.setAttribute("aria-hidden", "true");
      if (previewReturnFocus instanceof HTMLElement) previewReturnFocus.focus();
      previewReturnFocus = null;
    }

    function printPdf() {
      if (!validateForExport()) return;
      const canvas = makeCanvas();
      const dataUrl = canvas.toDataURL("image/png");
      const shareCard = byId("shareCard");
      shareCard.innerHTML = `<div class="print-sheet"><img id="printEstimateImage" src="${dataUrl}" alt="賃貸初期費用概算書"></div>`;
      const printImage = byId("printEstimateImage");
      const openPrintDialog = () => requestAnimationFrame(() => window.print());
      if (printImage.complete) openPrintDialog();
      else printImage.addEventListener("load", openPrintDialog, { once: true });
    }

    function showToast(message) {
      const toast = byId("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 3000);
    }

    monthlyDefaults.forEach((item, index) => {
      byId("monthlyItems").appendChild(makeMonthlyItem(index, item.label, item.value, item.includeInAdvance, item.includeInGuarantee, item.mode));
    });
    contractDefs.forEach((def) => byId("contractItems").appendChild(makeLineItem(def)));
    addExtraItem();
    byId("addMonthly").addEventListener("click", () => {
      const item = makeMonthlyItem(monthlyRows().length, "", "", true);
      item.open = true;
      byId("monthlyItems").appendChild(item);
      calculate();
      item.querySelector("input").focus();
    });
    byId("addExtra").addEventListener("click", () => {
      addExtraItem("", "", true);
    });
    byId("extraItems").addEventListener("click", (event) => {
      const removeButton = event.target.closest("[data-remove-extra]");
      if (!removeButton) return;
      removeButton.closest("[data-extra]").remove();
      calculate();
    });
    byId("issuerFields").addEventListener("input", saveIssuerInfo);
    byId("issuerFields").addEventListener("change", saveIssuerInfo);
    byId("clearIssuer").addEventListener("click", clearIssuerInfo);
    byId("shareImage").addEventListener("click", shareImage);
    byId("saveImage").addEventListener("click", saveImage);
    byId("printPdf").addEventListener("click", printPdf);
    byId("advanceDatePrompt").addEventListener("click", () => {
      const contractStartDate = byId("contractStartDate");
      contractStartDate.scrollIntoView({ behavior: "smooth", block: "center" });
      contractStartDate.focus();
    });
    byId("closePreview").addEventListener("click", closeImagePreview);
    byId("imagePreview").addEventListener("click", (event) => {
      if (event.target === byId("imagePreview")) closeImagePreview();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && byId("imagePreview").classList.contains("show")) closeImagePreview();
    });
    byId("customerName").addEventListener("blur", () => {
      normalizeCustomerName();
      calculate();
    });
    document.addEventListener("input", (event) => {
      if (event.target instanceof HTMLElement) event.target.removeAttribute("aria-invalid");
      calculate();
    });
    document.addEventListener("focusout", (event) => {
      if (event.target instanceof HTMLInputElement && event.target.matches("[data-money]")) {
        formatMoneyInputField(event.target);
        calculate();
      }
    });
    document.addEventListener("change", calculate);
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    }
    loadIssuerInfo();
    calculate();
  </script>
</body>
</html>
